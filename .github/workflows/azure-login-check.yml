# Proves the infra identity can sign in to Azure with OIDC and no stored
# secret (P3-21). Run it by hand from main: the federated credential trusts
# refs/heads/main, so a run from another branch is refused. The OpenTofu
# steps belong to the infra pipeline, P8-01.
name: azure-login-check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  login:
    name: azure login (infra identity)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_INFRA }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Show the subscription
        run: az account show --query name -o tsv

      - name: List the resource groups it can see
        run: az group list --query "[].name" -o tsv
