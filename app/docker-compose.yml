# Local development only. The passwords, secrets and Service Bus connection
# string below are fixed values for these containers, not real credentials.
# The services have no built-in hosts or secrets, so each one gets every
# setting it needs here.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: app
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # TCP, not the socket: the first-run init server listens on the socket only
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "app", "-d", "orders"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 60s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:1.0.7@sha256:1dcc88d2d9e555d0addb0636648d0da033206978d7c5c4da044c904a0f06f58b
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: LocalDev-Passw0rd

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:2.0.1@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    ports:
      - "5672:5672"
      - "5300:5300"
    environment:
      SQL_SERVER: sqledge
      MSSQL_SA_PASSWORD: LocalDev-Passw0rd
      ACCEPT_EULA: "Y"
    volumes:
      - ./servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      - sqledge

  # The emulator image has no shell or HTTP client, so it cannot run its own
  # healthcheck. This one-shot container polls the emulator's health endpoint
  # and exits 0 once it is healthy, and the Service Bus clients wait for that.
  # The emulator usually takes 30 to 90s from cold. After 300s the poller
  # exits 1 with "Service Bus emulator not healthy after 300s".
  servicebus-ready:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    command:
      - sh
      - -c
      - |
        deadline=$$(( $$(date +%s) + 300 ))
        until wget -q -T 2 -O /dev/null http://servicebus-emulator:5300/health 2>/dev/null; do
          if [ $$(date +%s) -ge $$deadline ]; then
            echo "Service Bus emulator not healthy after 300s" >&2
            exit 1
          fi
          sleep 2
        done
        echo "Service Bus emulator is healthy"
    depends_on:
      - servicebus-emulator

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-dev-secret
      # The dashboard UI logs in as this email. Login checks no password, so
      # set ADMIN_EMAILS only for local use.
      ADMIN_EMAILS: admin@platform.local
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      SHIPPING_SERVICE_URL: http://shipping-service:8085
      DASHBOARD_SERVICE_URL: http://dashboard-api:8086
    depends_on:
      redis:
        condition: service_healthy

  order-service:
    build: ./services/order-service
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
      SERVICEBUS_QUEUE: order-events
      SERVICEBUS_CONNECTION_STRING: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      postgres:
        condition: service_healthy
      servicebus-ready:
        condition: service_completed_successfully

  inventory-service:
    build: ./services/inventory-service
    ports:
      - "8082:8082"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./services/payment-service
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
      SERVICEBUS_QUEUE: order-events
      SERVICEBUS_CONNECTION_STRING: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      postgres:
        condition: service_healthy
      servicebus-ready:
        condition: service_completed_successfully

  notification-service:
    build: ./services/notification-service
    ports:
      - "8084:8084"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  shipping-service:
    build: ./services/shipping-service
    ports:
      - "8085:8085"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
      SHIPPING_WEBHOOK_SECRET: local-webhook-secret
      SERVICEBUS_QUEUE: order-events
      SERVICEBUS_CONNECTION_STRING: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
    depends_on:
      postgres:
        condition: service_healthy
      servicebus-ready:
        condition: service_completed_successfully

  worker:
    build: ./services/worker
    environment:
      SERVICEBUS_QUEUE: order-events
      SERVICEBUS_CONNECTION_STRING: Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      PAYMENT_SERVICE_URL: http://payment-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      SHIPPING_SERVICE_URL: http://shipping-service:8085
    depends_on:
      servicebus-ready:
        condition: service_completed_successfully

  scheduler:
    build: ./services/scheduler
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
    depends_on:
      postgres:
        condition: service_healthy
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started

  dashboard-api:
    build: ./services/dashboard-api
    ports:
      - "8086:8086"
    environment:
      DATABASE_URL: postgres://app:localdev@postgres:5432/orders?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      # They create the tables this service reads
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
      shipping-service:
        condition: service_started

volumes:
  pgdata:
