apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - rbac.yaml
  - cronjob.yaml
  - networkpolicy.yaml

# The CronJob runs snapshot.sh from this ConfigMap. The name hash makes a
# script change roll into the CronJob on the next apply.
configMapGenerator:
  - name: postgres-snapshot
    files:
      - snapshot.sh
