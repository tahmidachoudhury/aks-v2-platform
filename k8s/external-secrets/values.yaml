# Helm values for the external-secrets chart, version 2.15.0 from
# oci://ghcr.io/external-secrets/charts/external-secrets. The
# external-secrets Application in argocd/apps pins the version and reads
# this file. The reasons are in README.md.
#
# The client ID annotation is not here. The Application sets it from
# OpenTofu, so no ID is committed. See
# ../../infra/modules/workload-identity/README.md#client-ids.

# Matches the federated credential's subject,
# system:serviceaccount:platform:external-secrets.
serviceAccount:
  name: external-secrets

# The workload identity webhook injects AZURE_CLIENT_ID, AZURE_TENANT_ID and
# the token file into labelled pods only. Only the controller talks to Key
# Vault, so only it gets the label.
podLabels:
  azure.workload.identity/use: "true"

# Small, because the general NodePool is capped at 4 vCPUs. Memory limits
# only: no CPU limit, so a burst of reconciles can use idle CPU instead of
# being throttled.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

# The validating webhook fails closed, so while no replica is up the API
# server rejects every ExternalSecret and store write. NAP repacks nodes
# after a minute, so run two and let the budget keep one up during a drain.
webhook:
  replicaCount: 2
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
