# Acceptance test for P4-06 only. Not part of any other kustomization, and
# deleted once it has passed. It copies jwt-secret into a Secret called
# eso-smoke-test in apps. jwt-secret is the cheapest to rotate if this
# Secret is left behind: a new value only signs users out.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: eso-smoke-test
  namespace: apps
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: eso-smoke-test
  data:
    - secretKey: value
      remoteRef:
        key: jwt-secret
