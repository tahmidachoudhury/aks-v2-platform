# The one store every ExternalSecret reads from. It signs in as the ESO
# controller's own workload identity, id-external-secrets, through the
# AZURE_* variables the workload identity webhook injects. With no
# serviceAccountRef there is no tenantId or clientId to set here: the AKS
# webhook supplies the cluster's tenant.
#
# vaultUrl is a placeholder. The external-secrets-store Application in
# argocd/apps replaces it with the vault URI from OpenTofu.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: azure-key-vault
spec:
  provider:
    azurekv:
      authType: WorkloadIdentity
      vaultUrl: VAULT_URL_FROM_ARGOCD
  # Only the namespaces that hold workloads may read the vault through this
  # store. An ExternalSecret anywhere else is refused.
  conditions:
    - namespaces:
        - apps
        - data
