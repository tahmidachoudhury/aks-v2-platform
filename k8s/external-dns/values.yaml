# ExternalDNS, chart external-dns 1.23.0 (ExternalDNS 0.23.0) from
# https://kubernetes-sigs.github.io/external-dns/, installed into the
# platform namespace. Install command and design: README.md.
#
# Two values are left out because this repo is public, and the install
# command sets them from OpenTofu and the az CLI:
#   serviceAccount.annotations."azure.workload.identity/client-id"
#   extraArgs.azure-subscription-id

provider:
  name: azure

# Only the delegated zone, and only records this instance owns. sync deletes
# a record when its Ingress goes. The TXT registry stops it touching records
# it didn't create.
domainFilters:
  - azure.order-fulfilment.tahmidchoudhury.uk
policy: sync
registry: txt
txtOwnerId: aks-v2-platform

extraArgs:
  # The zone's group. id-external-dns has Reader on it to list zones.
  azure-resource-group: rg-aks-v2-persistent

# Workload identity: the webhook injects the token and tenant for pods with
# this label. The federated credential trusts
# system:serviceaccount:platform:external-dns, the chart's default name.
podLabels:
  azure.workload.identity/use: "true"

# The Azure provider reads its settings from /etc/kubernetes/azure.json and
# fails without the file. Nothing in it is secret: the subscription and
# resource group come from the flags above, and the client ID and tenant
# from the workload identity webhook.
secretConfiguration:
  enabled: true
  mountPath: /etc/kubernetes/
  data:
    azure.json: |
      {"useWorkloadIdentityExtension": true}

# The general NodePool is capped at 4 vCPUs, so requests stay small.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi
