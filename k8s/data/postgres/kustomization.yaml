apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - external-secret.yaml
  - service.yaml
  - statefulset.yaml
  - pdb.yaml
  - networkpolicy.yaml

# The image runs this on the first start against an empty disk. Editing it
# changes the ConfigMap's hash suffix, which rolls the pod, but on a disk that
# already holds data the image skips it, so run it by hand to apply a change
# mid-day (README.md). Each morning's empty disk gets it anyway.
configMapGenerator:
  - name: postgres-init
    files:
      - app-role.sql
