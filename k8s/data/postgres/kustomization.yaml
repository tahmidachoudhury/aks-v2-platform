apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: data
resources:
  - external-secret.yaml
  - service.yaml
  - statefulset.yaml
  - pdb.yaml

# Runs once, on the first start against an empty disk. The hash suffix rolls
# the pod if the script changes.
configMapGenerator:
  - name: postgres-init
    files:
      - init-app-role.sh
