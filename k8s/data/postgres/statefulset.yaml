# One Postgres replica on a 20Gi Premium ZRS disk. The official image starts
# as UID 999 directly, so the namespace's restricted Pod Security admits it.
# The disk is mounted at /var/lib/postgresql/data and PGDATA is a
# subdirectory, since the disk's root holds lost+found and initdb needs an
# empty directory.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: data
  labels:
    app.kubernetes.io/name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      priorityClassName: data-critical
      # On-demand NAP nodes only. Spot nodes carry capacity-type spot and the
      # system nodes carry no capacity-type label, so both are ruled out even
      # if a toleration is ever added by mistake.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/capacity-type
                    operator: In
                    values: ["on-demand"]
      automountServiceAccountToken: false
      # Stops Kubernetes injecting POSTGRES_PORT and friends from the Service.
      enableServiceLinks: false
      # The preStop hook's fast shutdown plus a checkpoint fits well inside this.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:16.16-bookworm@sha256:ce3efec6bc404f6b15ebf5d9bed6b45a9d4655aea238d7dacc3467ccb05a1175
          # Sized from the services' pool caps at their HPA maximums, plus a
          # rollout's surge pod and the migration Job (README, Postgres
          # connections). The entrypoint passes these flags on to postgres.
          args: ["-c", "max_connections=350"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: orders
            # A file, not an env var, so a rotated Secret reaches the pod
            # without a restart and app-role.sql can read the current value.
            - name: POSTGRES_PASSWORD_FILE
              value: /etc/postgres-credentials/password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # pg_isready over TCP, not the socket: during first-run init the
          # image's temporary server listens on the socket only, so the pod
          # isn't Ready until the real server is up. It doesn't log in, so it
          # needs no password.
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "orders"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "orders"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-p", "5432", "-U", "postgres", "-d", "orders"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          # Kubernetes sends SIGTERM, which Postgres treats as a smart
          # shutdown: it waits for every client to disconnect, and pooled
          # connections never do. A fast shutdown rolls back open
          # transactions and checkpoints, so the next start skips crash
          # recovery.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "pg_ctl stop -D \"$PGDATA\" -m fast -w -t 50"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: credentials
              mountPath: /etc/postgres-credentials
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
        - name: credentials
          secret:
            secretName: postgres-credentials
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: premium-zrs
        resources:
          requests:
            storage: 20Gi
