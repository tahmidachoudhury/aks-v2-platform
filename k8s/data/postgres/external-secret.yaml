# Copies postgres-password from Key Vault into the Secret postgres-credentials.
# The StatefulSet mounts it as a file: the image reads it as the superuser's
# password and app-role.sql gives it to the app role.
#
# OnChange: synced once, then only on the force-sync annotation. With an
# hourly refresh, a make data or make cluster run within the hour after a
# Key Vault rotation would set the new password on the role while the
# services' copies in apps still hold the old one. The rotation order is in
# ../README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: data
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: postgres-credentials
  data:
    - secretKey: password
      remoteRef:
        key: postgres-password
