# Copies redis-password from Key Vault into the Secret redis-credentials, which
# the StatefulSet reads as requirepass.
#
# OnChange: synced once, then only on the force-sync annotation. With an
# hourly refresh, any restart of redis-0 within the hour after a Key Vault
# rotation would start Redis on the new password while api-gateway's copy
# still holds the old one. The rotation order is in ../README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: data
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: redis-credentials
  data:
    - secretKey: password
      remoteRef:
        key: redis-password
