# Copies redis-password from Key Vault into the Secret redis-credentials, which
# the StatefulSet reads as requirepass.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: data
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: redis-credentials
  data:
    - secretKey: password
      remoteRef:
        key: redis-password
