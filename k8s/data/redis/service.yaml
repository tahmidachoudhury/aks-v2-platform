# Headless, as the StatefulSet's governing Service. redis.data.svc.cluster.local
# resolves to the pod's IP once it is Ready.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: data
  labels:
    app.kubernetes.io/name: redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
