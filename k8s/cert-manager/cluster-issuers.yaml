# Let's Encrypt staging and production, both solving HTTP-01 through
# Traefik. Use staging until a test passes: its limits are far higher. No
# email: Let's Encrypt no longer sends expiry mail, and this repo is public.
# The ACME account keys live in the platform namespace, cert-manager's
# cluster resource namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-production-account
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
