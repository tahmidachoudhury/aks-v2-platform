# cert-manager, chart cert-manager v1.21.3 from https://charts.jetstack.io,
# installed into the platform namespace. Install command and design:
# README.md.

# The chart installs and upgrades the CRDs. keep stops helm uninstall from
# deleting them, and every Certificate with them.
crds:
  enabled: true
  keep: true

# The general NodePool is capped at 4 vCPUs, so requests stay small.
resources:
  requests:
    cpu: 10m
    memory: 64Mi
  limits:
    memory: 256Mi

webhook:
  # AKS's admissions enforcer adds the two AKS expressions to every webhook's
  # namespaceSelector, so kube-system and AKS-managed namespaces never call
  # it. Declaring them here keeps the chart and AKS in agreement. Without
  # them a second `helm upgrade` fails with a server-side apply conflict on
  # .webhooks[].namespaceSelector, owned by "admissionsenforcer".
  validatingWebhookConfiguration:
    namespaceSelector:
      matchExpressions:
        - key: cert-manager.io/disable-validation
          operator: NotIn
          values: ["true"]
        - key: control-plane
          operator: NotIn
          values: ["true"]
        - key: kubernetes.azure.com/managedby
          operator: NotIn
          values: ["aks"]
  mutatingWebhookConfiguration:
    namespaceSelector:
      matchExpressions:
        - key: control-plane
          operator: NotIn
          values: ["true"]
        - key: kubernetes.azure.com/managedby
          operator: NotIn
          values: ["aks"]
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

cainjector:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi
