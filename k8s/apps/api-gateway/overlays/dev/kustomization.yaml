# The dev environment's settings for api-gateway. CI bumps newTag here (P8).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - ../../base
  # The host is this environment's, so the Ingress lives in the overlay.
  - ingress.yaml

# The tag is the first 12 characters of the last commit that touched
# app/services/api-gateway, the tag make images builds. make pin-images sets it.
# The registry stays a placeholder until k8s/apps/dev fills it in.
images:
  - name: ACR_LOGIN_SERVER/api-gateway
    newTag: b33be046503f

replicas:
  - name: api-gateway
    count: 2
