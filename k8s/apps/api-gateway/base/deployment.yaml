# The public entry point: issues JWTs, rate limits through Redis and proxies
# to the six HTTP services. Traefik is its only caller.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
  annotations:
    # Reloader rolls this Deployment when the api-gateway Secret changes, and
    # for no other Secret, so rotating one key restarts only its users.
    secret.reloader.stakater.com/reload: api-gateway
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-gateway
    spec:
      serviceAccountName: api-gateway
      containers:
        - name: app
          image: ACR_LOGIN_SERVER/api-gateway
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway
            - secretRef:
                name: api-gateway
