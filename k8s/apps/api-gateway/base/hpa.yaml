# Scales on CPU at 70% of the 40m request, per the Autoscaling ADR. Two at
# least, so the public entry point runs on two nodes, in two zones when it
# can. Rate-limit counters live in Redis, so replicas share them.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
