# The JWT signing key. Hourly: a new key only signs users out. Reloader
# restarts api-gateway when this Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: api-gateway
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: jwt-secret
---
# REDIS_URL, built from the Redis password. go-redis has no environment
# fallback for the password, so it goes inside the URL, escaped with
# urlquery. The generated secrets are letters and digits today
# (infra/modules/keyvault), so the escaping only matters if that changes.
#
# OnChange: synced once, then only on the force-sync annotation. Redis reads
# its password only at startup, so an hourly refresh would restart the
# gateway onto a password Redis doesn't have yet. The rotation order is in
# k8s/data/README.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-gateway-redis
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: api-gateway-redis
    template:
      engineVersion: v2
      data:
        REDIS_URL: "redis://:{{ .redisPassword | urlquery }}@redis.data.svc.cluster.local:6379/0"
  data:
    - secretKey: redisPassword
      remoteRef:
        key: redis-password
