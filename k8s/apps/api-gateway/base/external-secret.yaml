# JWT_SECRET, and REDIS_URL built from the Redis password. go-redis has no
# environment fallback for the password, so it goes inside the URL, escaped
# with urlquery. The generated secrets are letters and digits today
# (infra/modules/keyvault), so the escaping only matters if that changes.
# Reloader restarts api-gateway when this Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: api-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: api-gateway
    template:
      engineVersion: v2
      data:
        JWT_SECRET: "{{ .jwtSecret }}"
        REDIS_URL: "redis://:{{ .redisPassword | urlquery }}@redis.data.svc.cluster.local:6379/0"
  data:
    - secretKey: jwtSecret
      remoteRef:
        key: jwt-secret
    - secretKey: redisPassword
      remoteRef:
        key: redis-password
