# Named after the service folder: the federated credential of id-payment-service
# trusts system:serviceaccount:apps:payment-service (infra/platform/main.tf). The
# client ID is a placeholder. k8s/apps/dev puts in the real one from the
# persistent output, so no ID is committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
  annotations:
    azure.workload.identity/client-id: CLIENT_ID_FROM_AZURE_ENV
