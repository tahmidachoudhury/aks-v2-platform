# The app role's password, as PGPASSWORD. DATABASE_URL in config.env has no
# password: lib/pq takes it from PGPASSWORD, so it needs no URL escaping, as
# in the migration Job (k8s/migrations). Reloader restarts payment-service when this
# Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: payment-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: payment-service
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: postgres-password
