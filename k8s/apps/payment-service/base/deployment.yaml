# Simulated charges and refunds. Publishes payment events to Service Bus as
# id-payment-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
  annotations:
    # Reloader rolls this Deployment when the payment-service Secret changes, and
    # for no other Secret, so rotating one key restarts only its users.
    secret.reloader.stakater.com/reload: payment-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-service
        # The workload identity webhook injects AZURE_CLIENT_ID, the tenant
        # and a token file only into pods with this label.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: payment-service
      containers:
        - name: app
          image: ACR_LOGIN_SERVER/payment-service
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: payment-service
            - secretRef:
                name: payment-service
          # Placeholders: k8s/apps/dev fills them in from the platform outputs.
          # No SERVICEBUS_CONNECTION_STRING, so the SDK signs in with
          # DefaultAzureCredential, which picks up the workload identity.
          env:
            - name: SERVICEBUS_NAMESPACE
              value: SERVICEBUS_FQDN_FROM_AZURE_ENV
            - name: SERVICEBUS_QUEUE
              value: SERVICEBUS_QUEUE_FROM_AZURE_ENV
