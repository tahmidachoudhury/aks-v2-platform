# Orders and their status. Publishes order events to Service Bus as
# id-order-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      serviceAccountName: order-service
      containers:
        - name: app
          image: ACR_LOGIN_SERVER/order-service
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: order-service
          # Placeholders: k8s/apps/dev fills them in from the platform outputs.
          env:
            - name: SERVICEBUS_NAMESPACE
              value: SERVICEBUS_FQDN_FROM_AZURE_ENV
            - name: SERVICEBUS_QUEUE
              value: SERVICEBUS_QUEUE_FROM_AZURE_ENV
