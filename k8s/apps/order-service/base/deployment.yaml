# Orders and their status. Publishes order events to Service Bus as
# id-order-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
  annotations:
    # Reloader rolls this Deployment when a Secret listed here changes, and
    # for no other, so rotating one key restarts only the services that
    # read it.
    secret.reloader.stakater.com/reload: order-service-postgres
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
        # The workload identity webhook injects AZURE_CLIENT_ID, the tenant
        # and a token file only into pods with this label.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: order-service
      containers:
        - name: app
          image: ACR_LOGIN_SERVER/order-service
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: order-service
            - secretRef:
                name: order-service-postgres
          # Placeholders: the Application in argocd/apps fills them in from OpenTofu.
          # No SERVICEBUS_CONNECTION_STRING, so the SDK signs in with
          # DefaultAzureCredential, which picks up the workload identity.
          env:
            - name: SERVICEBUS_NAMESPACE
              value: SERVICEBUS_FQDN_FROM_ARGOCD
            - name: SERVICEBUS_QUEUE
              value: SERVICEBUS_QUEUE_FROM_ARGOCD
