# The dev environment's settings for scheduler. CI bumps newTag here (P8).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# The tag is the first 12 characters of the last commit that touched
# app/services/scheduler, the tag make images builds. make pin-images sets it.
# The registry stays a placeholder until k8s/apps/dev fills it in.
images:
  - name: ACR_LOGIN_SERVER/scheduler
    newTag: b33be046503f

# Always exactly one, in every environment: the jobs have no lock. See the
# base for why the rollout is Recreate.
replicas:
  - name: scheduler
    count: 1
