# What this service may talk to. default-deny in k8s/namespaces blocks the
# rest, and allow-dns there lets every pod reach CoreDNS.
# In: api-gateway, and the scheduler, which releases expired stock here.
# Out: Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: scheduler
      ports:
        - protocol: TCP
          port: 8082
  egress:
    # Postgres, for the orders database.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
