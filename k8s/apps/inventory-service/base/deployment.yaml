# Products and stock reservations.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  labels:
    app.kubernetes.io/name: inventory-service
  annotations:
    # Reloader rolls this Deployment when a Secret listed here changes, and
    # for no other, so rotating one key restarts only the services that
    # read it.
    secret.reloader.stakater.com/reload: inventory-service-postgres
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: inventory-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inventory-service
    spec:
      serviceAccountName: inventory-service
      containers:
        - name: app
          image: ACR_LOGIN_SERVER/inventory-service
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: inventory-service
            - secretRef:
                name: inventory-service-postgres
