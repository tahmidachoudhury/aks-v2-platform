apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml

components:
  - ../../components/service

# Settings that are not secret. The hash suffix on the name changes with the
# content, so an edit here rolls the pods.
configMapGenerator:
  - name: inventory-service
    envs:
      - config.env
