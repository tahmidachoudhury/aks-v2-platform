# A hard zone spread for the five services that run two or more replicas at
# their minimum: api-gateway and the four backends the gateway and the
# scheduler call. Their bases list it after components/service, so this patch
# runs second and turns that component's zone preference into a rule. The
# other four keep the preference: notification-service and dashboard-api
# idle at one replica, the worker prefers spot, and the scheduler is one pod.
# See k8s/apps/README.md, Disruption and spread.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: zone-spread.yaml
    target:
      kind: Deployment
