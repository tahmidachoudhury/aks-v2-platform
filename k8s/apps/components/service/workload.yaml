# Merged into every service workload, the eight Deployments and the
# scheduler's StatefulSet. The kind and name are ignored: the target in
# kustomization.yaml picks the workloads by kind. Only fields both kinds have
# belong here. Each base sets its own port, named http, so the probes here
# find it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: any-service
spec:
  revisionHistoryLimit: 3
  template:
    spec:
      # Stops Kubernetes injecting ORDER_SERVICE_PORT and friends for every
      # Service in apps. The services read only the variables we set.
      enableServiceLinks: false
      # The preStop sleep (5s), then, after SIGTERM, the HTTP services' drain
      # (SHUTDOWN_DRAIN_DELAY, 5s) and up to 30s for in-flight requests: 40s.
      # The scheduler takes 5s, then up to 20s for a running job and 5s for
      # its health server. 45s covers both with room to spare.
      terminationGracePeriodSeconds: 45
      # Spread each service's pods across zones, then nodes, so losing one
      # takes out as few as possible. A preference here: the five
      # multi-replica services also include components/host-spread, which
      # makes the hostname entry, the second, a hard rule. matchLabelKeys
      # narrows the selector to this service's pods of this revision, so one
      # rule fits every service.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: order-fulfilment
          matchLabelKeys:
            - app.kubernetes.io/name
            - pod-template-hash
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: order-fulfilment
          matchLabelKeys:
            - app.kubernetes.io/name
            - pod-template-hash
      # The images are distroless static:nonroot, user and group 65532.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # 40m is the per-pod budget in k8s/namespaces/README.md: the HPA
          # maximums add up to 26 pods, and 26 x 40m fits the apps quota with
          # room for four rollout surge pods at once (k8s/apps/README.md,
          # Quotas). No CPU limit, as the namespace README says.
          resources:
            requests:
              cpu: 40m
              memory: 64Mi
            limits:
              memory: 256Mi
          # Holds SIGTERM back 5s after the pod leaves the Service endpoints,
          # so Cilium and Traefik stop sending it new connections before the
          # service starts its own drain. The images have no shell, so this is
          # the kubelet's sleep action, not an exec of sleep.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The services that use Postgres ping it for up to 120s before they
          # listen at all, so /livez gets 150s to answer before the kubelet
          # gives up on a new pod. After that, liveness takes over.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          # /livez is always 200 while the process runs. It never checks a
          # dependency, so a Postgres or Service Bus outage can't restart pods.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # /healthz is readiness: 503 on SIGTERM, for Postgres where a service
          # uses it, and for Service Bus on the worker. The Postgres ping has
          # no timeout of its own, so timeoutSeconds is what bounds it.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
