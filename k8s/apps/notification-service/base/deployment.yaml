# Simulated email and SMS sends from stored templates.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app.kubernetes.io/name: notification-service
  annotations:
    # Reloader rolls this Deployment when the notification-service Secret changes, and
    # for no other Secret, so rotating one key restarts only its users.
    secret.reloader.stakater.com/reload: notification-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
    spec:
      serviceAccountName: notification-service
      containers:
        - name: app
          image: ACR_LOGIN_SERVER/notification-service
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: notification-service
            - secretRef:
                name: notification-service
