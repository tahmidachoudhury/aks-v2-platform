# Shipments, tracking and the carriers' webhook. Publishes shipment events to
# Service Bus as id-shipping-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  labels:
    app.kubernetes.io/name: shipping-service
  annotations:
    # Reloader rolls this Deployment when the shipping-service Secret changes, and
    # for no other Secret, so rotating one key restarts only its users.
    secret.reloader.stakater.com/reload: shipping-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-service
        # The workload identity webhook injects AZURE_CLIENT_ID, the tenant
        # and a token file only into pods with this label.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: shipping-service
      containers:
        - name: app
          image: ACR_LOGIN_SERVER/shipping-service
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: shipping-service
            - secretRef:
                name: shipping-service
          # Placeholders: k8s/apps/dev fills them in from the platform outputs.
          # No SERVICEBUS_CONNECTION_STRING, so the SDK signs in with
          # DefaultAzureCredential, which picks up the workload identity.
          env:
            - name: SERVICEBUS_NAMESPACE
              value: SERVICEBUS_FQDN_FROM_AZURE_ENV
            - name: SERVICEBUS_QUEUE
              value: SERVICEBUS_QUEUE_FROM_AZURE_ENV
