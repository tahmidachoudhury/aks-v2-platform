# Shipments, tracking and the carriers' webhook. Publishes shipment events to
# Service Bus as id-shipping-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipping-service
  labels:
    app.kubernetes.io/name: shipping-service
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: shipping-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shipping-service
    spec:
      serviceAccountName: shipping-service
      containers:
        - name: app
          image: ACR_LOGIN_SERVER/shipping-service
          ports:
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: shipping-service
          # Placeholders: k8s/apps/dev fills them in from the platform outputs.
          env:
            - name: SERVICEBUS_NAMESPACE
              value: SERVICEBUS_FQDN_FROM_AZURE_ENV
            - name: SERVICEBUS_QUEUE
              value: SERVICEBUS_QUEUE_FROM_AZURE_ENV
