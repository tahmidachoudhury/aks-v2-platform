# Named after the service folder: the federated credential of id-shipping-service
# trusts system:serviceaccount:apps:shipping-service (infra/platform/main.tf). The
# client ID is a placeholder. Its Application in argocd/apps puts in the real
# one from OpenTofu, so no ID is committed.
#
# No API token: the service never calls the API server. The workload
# identity webhook mounts its own projected token for Entra ID, whatever
# this setting says.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shipping-service
  labels:
    app.kubernetes.io/name: shipping-service
  annotations:
    azure.workload.identity/client-id: CLIENT_ID_FROM_ARGOCD
automountServiceAccountToken: false
