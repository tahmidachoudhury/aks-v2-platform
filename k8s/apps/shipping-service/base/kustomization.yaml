apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - serviceaccount.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - pdb.yaml
  - hpa.yaml

components:
  - ../../components/service
  - ../../components/zone-spread

# Settings that are not secret. The hash suffix on the name changes with the
# content, so an edit here rolls the pods.
configMapGenerator:
  - name: shipping-service
    envs:
      - config.env
