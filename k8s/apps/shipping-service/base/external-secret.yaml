# The app role's password, as PGPASSWORD. DATABASE_URL in config.env has no
# password: lib/pq takes it from PGPASSWORD, so it needs no URL escaping, as
# in the migration Job (k8s/migrations).
#
# OnChange: synced once, then only when this object changes, which is what
# the force-sync annotation does. Postgres takes a new password only when
# make data runs, so an hourly refresh would restart shipping-service onto a
# password the role doesn't have yet. The rotation order is in
# k8s/data/README.md. Reloader restarts shipping-service when this Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shipping-service-postgres
spec:
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: shipping-service-postgres
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: postgres-password
---
# The carriers' webhook secret. Hourly, as nothing else has to change first:
# shipping-service just starts comparing against the new value. Reloader
# restarts shipping-service, and only it, when this Secret changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shipping-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: shipping-service
  data:
    - secretKey: SHIPPING_WEBHOOK_SECRET
      remoteRef:
        key: shipping-webhook-secret
