# The app role's password as PGPASSWORD, and the carriers' webhook secret.
# DATABASE_URL in config.env has no password: lib/pq takes it from
# PGPASSWORD, so it needs no URL escaping, as in the migration Job
# (k8s/migrations). Reloader restarts shipping-service when either changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shipping-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: shipping-service
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: postgres-password
    - secretKey: SHIPPING_WEBHOOK_SECRET
      remoteRef:
        key: shipping-webhook-secret
