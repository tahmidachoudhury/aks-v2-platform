# The dev environment's settings for shipping-service. CI bumps newTag here (P8).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

# The tag is the first 12 characters of the last commit that touched
# app/services/shipping-service, the tag make images builds. make pin-images sets it.
# The registry stays a placeholder until its Application in argocd/apps fills it in.
images:
  - name: ACR_LOGIN_SERVER/shipping-service
    newTag: b33be046503f

# No replica count: the HPA in the base owns it, and a count here would reset it on
# every apply.
