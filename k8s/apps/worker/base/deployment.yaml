# Receives every event from the queue as id-worker, in PeekLock mode, so a
# message it doesn't complete goes back to the queue. Its port serves only
# /livez and /healthz.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        # The workload identity webhook injects AZURE_CLIENT_ID, the tenant
        # and a token file only into pods with this label.
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: worker
      # The only service allowed on spot (k8s/node-pools). It loses nothing to
      # an eviction: a message it hasn't completed stays locked in the queue
      # and comes back when the lock expires. It prefers a spot node when one
      # exists, and NAP's spot pool outweighs general when it needs a new node
      # for a pending worker. It still runs on general when spot has none, so
      # an empty spot pool never stops the queue being worked.
      tolerations:
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: karpenter.sh/capacity-type
                    operator: In
                    values: ["spot"]
      containers:
        - name: app
          image: ACR_LOGIN_SERVER/worker
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - configMapRef:
                name: worker
          # Placeholders: the Application in argocd/apps fills them in from OpenTofu.
          # No SERVICEBUS_CONNECTION_STRING, so the SDK signs in with
          # DefaultAzureCredential, which picks up the workload identity.
          env:
            - name: SERVICEBUS_NAMESPACE
              value: SERVICEBUS_FQDN_FROM_ARGOCD
            - name: SERVICEBUS_QUEUE
              value: SERVICEBUS_QUEUE_FROM_ARGOCD
