# Named after the service folder: the federated credential of id-worker
# trusts system:serviceaccount:apps:worker (infra/platform/main.tf). The
# client ID is a placeholder. k8s/apps/dev puts in the real one from the
# persistent output, so no ID is committed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
  annotations:
    azure.workload.identity/client-id: CLIENT_ID_FROM_AZURE_ENV
