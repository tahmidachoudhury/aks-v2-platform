apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - external-secret.yaml
  - job.yaml

# Every file in sql/ goes into one ConfigMap, mounted into the Job. List each
# new migration here as well as adding the file: kustomize has no glob.
configMapGenerator:
  - name: db-migrate
    files:
      - sql/000001_baseline.up.sql
    options:
      annotations:
        # P7: created in PreSync before the Job, like the ExternalSecret.
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
        argocd.argoproj.io/sync-wave: "-1"

