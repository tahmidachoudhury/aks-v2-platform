apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: apps
resources:
  - external-secret.yaml
  - job.yaml
  - networkpolicy.yaml

# Every file in sql/ goes into one ConfigMap, mounted into the Job. List each
# new migration here as well as adding the file: kustomize has no glob. The
# hash suffix changes with the SQL, so a new migration makes the migrations
# Application OutOfSync, which is what makes Argo CD sync it and run the Job.
# The Job's volume follows the new name, and the old ConfigMap is pruned.
configMapGenerator:
  - name: db-migrate
    files:
      - sql/000001_baseline.up.sql
