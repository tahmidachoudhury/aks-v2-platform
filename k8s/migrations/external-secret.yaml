# The app role's password, copied from Key Vault into apps for the migration
# Job: pods in apps can't read postgres-credentials in data. The Job reads it
# as PGPASSWORD rather than a templated URL, so a password with @, : or / in
# it needs no escaping.
#
# The vault secret is postgres-password, shared by the postgres and app roles
# (k8s/data, P5-01). If that changes, change remoteRef.key here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-migrate
  namespace: apps
spec:
  # Synced once, then only on the force-sync annotation, like the services'
  # Postgres passwords: the role takes a new password only when app-role.sql
  # runs. The rotation order is in k8s/data/README.md.
  refreshPolicy: OnChange
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: db-migrate
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: postgres-password
