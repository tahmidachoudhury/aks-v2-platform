# The app role's password, copied from Key Vault into apps for the migration
# Job: pods in apps can't read postgres-credentials in data. The Job reads it
# as PGPASSWORD rather than a templated URL, so a password with @, : or / in
# it needs no escaping.
#
# The vault secret is postgres-password, shared by the postgres and app roles
# (k8s/data, P5-01). If that changes, change remoteRef.key here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-migrate
  namespace: apps
  annotations:
    # P7: a PreSync hook like the Job, one wave earlier, so the Secret exists
    # before the Job's pod starts. Ignored by kubectl.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault
  target:
    name: db-migrate
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: postgres-password
