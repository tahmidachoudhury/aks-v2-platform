# The migration Job's pod reaches Postgres and nothing else. default-deny in
# k8s/namespaces blocks the rest, and allow-dns there resolves the name.
# Postgres's own policy (k8s/data/postgres) lets db-migrate in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-migrate
  labels:
    app.kubernetes.io/name: db-migrate
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: db-migrate
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: data
          podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - protocol: TCP
          port: 5432
