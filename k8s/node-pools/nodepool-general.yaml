# On-demand nodes for user workloads. 4 vCPUs at most: the system pool uses
# 6 of the subscription's 10 standard vCPUs in UK South.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general
spec:
  weight: 10
  limits:
    cpu: "4"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
    budgets:
      - nodes: "1"
  template:
    metadata:
      labels:
        # Lets Karpenter account for the Cilium DaemonSet's overhead.
        kubernetes.azure.com/ebpf-dataplane: cilium
    spec:
      nodeClassRef:
        group: karpenter.azure.com
        kind: AKSNodeClass
        name: general
      expireAfter: Never
      startupTaints:
        - key: node.cilium.io/agent-not-ready
          value: "true"
          effect: NoExecute
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        # D family sizes this subscription can run. D2s_v6 and D4s_v6 are
        # offered in zones 2 and 3 only, the nls sizes in all three.
        - key: karpenter.azure.com/sku-name
          operator: In
          values:
            - Standard_D2s_v6
            - Standard_D4s_v6
            - Standard_D2nls_v6
            - Standard_D4nls_v6
        - key: topology.kubernetes.io/zone
          operator: In
          values: ["uksouth-1", "uksouth-2", "uksouth-3"]
