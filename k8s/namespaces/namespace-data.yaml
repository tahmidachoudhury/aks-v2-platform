# The Argo CD sync options stop a prune or an app deletion from removing it,
# which would delete Postgres, Redis and their disks with it. The data
# Application never prunes, and this keeps that true through the namespaces
# Application too. See README.md, Morning apply.
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
