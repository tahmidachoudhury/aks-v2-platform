# Traefik, cert-manager, ExternalDNS and External Secrets: about ten small
# pods. One LoadBalancer Service, Traefik's. No PVCs: cert-manager keeps
# certificates in Secrets.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: platform
  namespace: platform
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "20"
    persistentvolumeclaims: "0"
    services.loadbalancers: "1"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: platform
  namespace: platform
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        memory: 256Mi
      max:
        memory: 1Gi
