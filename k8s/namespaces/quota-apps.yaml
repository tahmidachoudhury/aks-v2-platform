# The nine services. CPU is held to what the general NodePool can supply,
# so P6 must keep pod CPU requests within the budget in README.md. Memory
# limits cover every HPA and KEDA maximum (26 pods) plus a 25% rolling
# surge (9 more) at the default limit. Stateless, and only Traefik is
# exposed, so no PVCs and no LoadBalancer Services.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: apps
  namespace: apps
spec:
  hard:
    requests.cpu: 1250m
    requests.memory: 4Gi
    limits.memory: 10Gi
    pods: "40"
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
---
# Defaults for any container that sets no resources, so the quota never
# rejects it for a missing request or memory limit. No CPU limit: a CPU
# limit throttles a pod even when the node is idle.
apiVersion: v1
kind: LimitRange
metadata:
  name: apps
  namespace: apps
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 40m
        memory: 64Mi
      default:
        memory: 256Mi
      max:
        memory: 1Gi
