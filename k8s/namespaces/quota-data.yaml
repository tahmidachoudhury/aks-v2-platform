# Postgres and Redis, one replica each, with room for a second Postgres
# restored from a snapshot. Memory limits fit all three containers at the
# 2Gi per-container maximum. Storage covers the 20Gi and 10Gi PVCs plus a
# 20Gi restore.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: data
  namespace: data
spec:
  hard:
    requests.cpu: 750m
    requests.memory: 2Gi
    limits.memory: 6Gi
    pods: "10"
    persistentvolumeclaims: "4"
    requests.storage: 64Gi
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: data
  namespace: data
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        memory: 512Mi
      max:
        memory: 2Gi
