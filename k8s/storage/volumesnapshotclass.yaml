# Incremental snapshots of Azure Disk volumes. AKS installs the snapshot CRDs
# and controller but no VolumeSnapshotClass. The name matches the one in the
# AKS and Azure Disk CSI docs. Snapshots land in the node resource group, so
# they go with the cluster each evening.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: csi-azuredisk-vsc
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
driver: disk.csi.azure.com
deletionPolicy: Delete
parameters:
  incremental: "true"
