# AKS's built-in "default" class, redeclared only to clear its default flag.
# AKS creates it with addonmanager.kubernetes.io/mode: EnsureExists, so the
# addon manager recreates it if deleted but never reverts an edit. The spec
# below must match what AKS creates, since a StorageClass's parameters can't
# change. If AKS ever changes them, the apply fails and this file needs the
# new values. Don't delete the class: AKS would recreate it as the default.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: default
  annotations:
    storageclass.kubernetes.io/is-default-class: "false"
provisioner: disk.csi.azure.com
parameters:
  skuname: StandardSSD_ZRS
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
